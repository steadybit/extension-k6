vulnerabilities:
  - id: CVE-2026-56854
    paths:
      - usr/local/bin/k6
    statement: |
      golang.org/x/crypto v0.54.0 is pinned by k6 v2.2.0 (fixed in v0.55.0). The flaw is in the
      x/crypto/ssh server implementation; the bundled k6 only acts as an SSH client via xk6-ssh.
      Waiting for upstream k6 to bump the dependency.
    expired_at: 2026-12-01
  - id: CVE-2026-84304
    paths:
      - usr/local/bin/k6
    statement: |
      google.golang.org/grpc v1.83.0 is pinned by k6 v2.2.0 and its xk6 extensions (fixed in
      v1.83.1). Waiting for upstream k6 to bump the dependency.
    expired_at: 2026-12-01
